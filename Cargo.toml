[workspace]
members = [
    "crates/xtask",
    "crates/stremio-lightning",
]
resolver = "2"

[workspace.package]
version = "0.1.4"
license = "GPL-3.0-only"

# Dev/test builds carried full DWARF for all 780+ dependencies by default, which
# dominated local build time (19.7 GB of .pdb files, 45 GB of target/debug).
# Line-table debug info for our own crates keeps `cargo test` backtraces and
# breakpoints usable; dependencies get none, since stepping into Slint/wgpu
# internals is rare. To revert, set `debug = 2` and drop the package override.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0
# Slint, FemtoVG, winit and tiny-skia are unusable at opt-level 0 (frame redraws lag while
# scrolling). Dependencies build once and stay cached; workspace crates remain at opt-level 0.
opt-level = 2

# Keep the image decoders at opt-level 3 (above the opt-level 2 dev-dependency default) so decoding
# a catalog's worth of posters stays faster than downloading them.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
split-debuginfo = "packed"
