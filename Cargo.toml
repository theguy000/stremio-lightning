[workspace]
members = [
    "crates/xtask",
    "crates/stremio-lightning-core",
    "crates/stremio-lightning-identity",
    "crates/stremio-lightning-linux",
    "crates/stremio-lightning-macos",
    "crates/stremio-lightning-env",
    "crates/stremio-lightning",
    "crates/stremio-lightning-windows",
]
resolver = "2"

# Dev/test builds carried full DWARF for all 780+ dependencies by default, which
# dominated local build time (19.7 GB of .pdb files, 45 GB of target/debug).
# Line-table debug info for our own crates keeps `cargo test` backtraces and
# breakpoints usable; dependencies get none, since stepping into Slint/wgpu
# internals is rare. To revert, set `debug = 2` and drop the package override.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
split-debuginfo = "packed"
