name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (fmt, clippy, test)
    runs-on: ubuntu-latest
    container:
      # Same image as the release workflow: the GTK/WebKit/mpv versions the
      # Linux shell links against only exist there.
      image: ubuntu:questing
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            curl \
            git \
            libgtk-4-dev \
            libmpv-dev \
            librsvg2-dev \
            libwebkitgtk-6.0-dev \
            mold \
            nodejs \
            pkg-config

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # Tests load the built mod UI bundle from src/dist.
      - name: Build frontend
        run: cargo xtask build-ui

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The Windows crate only builds on Windows (its host and window code is
      # cfg(windows)-gated), so the release workflow checks it there.
      - name: Clippy
        run: cargo clippy --workspace --exclude stremio-lightning-windows --all-targets

      - name: Test
        run: cargo test --workspace --exclude stremio-lightning-windows
