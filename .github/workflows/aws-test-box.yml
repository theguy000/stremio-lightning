name: aws-test-box

# Launches a throwaway Ubuntu desktop in AWS with the Linux packages from a publish.yml
# run already installed, or deletes every test box. Manual only.
#
# The job needs the `aws-test` environment: it only runs from master and waits for a
# required reviewer. The AWS keys belong to an IAM user that can only manage stacks
# named stremio-test-* in ap-south-1. This job runs no third-party actions and builds
# no repository code, because anything running here could read the keys.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "up = launch a test box, down = delete every test box"
        type: choice
        options: [up, down]
        default: up
      run_id:
        description: "publish.yml run to take the Linux packages from (empty = latest successful run)"
        type: string
        required: false
      instance_type:
        description: "Instance type (CPU only)"
        type: choice
        options: [c6i.xlarge, c5.xlarge, m5.xlarge, t3.xlarge]
        default: c6i.xlarge

permissions:
  contents: read
  actions: read

concurrency:
  group: aws-test-box
  cancel-in-progress: false

jobs:
  box:
    runs-on: ubuntu-24.04
    environment: aws-test
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
      AWS_PAGER: ""
      BUCKET: stremio-test-557690593146-aps1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Launch a test box
        if: inputs.action == 'up'
        env:
          RUN_ID_INPUT: ${{ inputs.run_id }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          BOX_PASSWORD: ${{ secrets.TEST_BOX_PASSWORD }}
          ALLOWED_CIDR: ${{ secrets.TEST_BOX_ALLOWED_CIDR }}
        run: |
          set -euo pipefail

          existing=$(aws cloudformation list-stacks \
            --stack-status-filter CREATE_IN_PROGRESS CREATE_COMPLETE ROLLBACK_COMPLETE ROLLBACK_FAILED DELETE_FAILED \
            --query "StackSummaries[?starts_with(StackName, 'stremio-test-')].StackName" --output text)
          if [ -n "$existing" ]; then
            echo "A test box already exists: $existing. Run this workflow with action=down first."
            exit 1
          fi

          RUN_ID="${RUN_ID_INPUT:-$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')}"
          [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ] || { echo "No successful publish.yml run found"; exit 1; }
          echo "Packages from publish.yml run $RUN_ID"

          mkdir pkg
          for name in Stremio_Lightning_Linux-x86_64.AppImage stremio-lightning-linux-amd64.deb Stremio_Lightning_Linux-x86_64.flatpak; do
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "pkg/$name"
          done
          appimage=$(find pkg/Stremio_Lightning_Linux-x86_64.AppImage -type f | head -1)
          deb=$(find pkg/stremio-lightning-linux-amd64.deb -type f | head -1)
          flatpak=$(find pkg/Stremio_Lightning_Linux-x86_64.flatpak -type f | head -1)

          gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/aws/test-box.yaml?ref=$GITHUB_SHA" > test-box.yaml
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/aws/box-setup.sh?ref=$GITHUB_SHA" > box-setup.sh

          prefix="s3://$BUCKET/runs/$GITHUB_RUN_ID"
          presign() {
            aws s3 cp --only-show-errors "$1" "$prefix/$2"
            aws s3 presign "$prefix/$2" --expires-in 14400
          }
          setup_url=$(presign box-setup.sh box-setup.sh)
          appimage_url=$(presign "$appimage" Stremio_Lightning.AppImage)
          deb_url=$(presign "$deb" stremio-lightning.deb)
          flatpak_url=$(presign "$flatpak" stremio-lightning.flatpak)
          for u in "$setup_url" "$appimage_url" "$deb_url" "$flatpak_url"; do echo "::add-mask::$u"; done

          ami=$(aws ec2 describe-images --owners 099720109477 \
            --filters 'Name=name,Values=ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*' 'Name=state,Values=available' \
            --query 'sort_by(Images,&CreationDate)[-1].ImageId' --output text)
          vpc=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query 'Vpcs[0].VpcId' --output text)
          cidr="${ALLOWED_CIDR:-0.0.0.0/0}"
          echo "AMI $ami, VPC $vpc, instance type $INSTANCE_TYPE, allowed CIDR $([ "$cidr" = 0.0.0.0/0 ] && echo 'anyone (password only)' || echo 'restricted')"

          jq -n --arg ami "$ami" --arg vpc "$vpc" --arg it "$INSTANCE_TYPE" --arg cidr "$cidr" --arg pw "$BOX_PASSWORD" \
                --arg s "$setup_url" --arg a "$appimage_url" --arg d "$deb_url" --arg f "$flatpak_url" '[
            {ParameterKey:"AmiId",ParameterValue:$ami},{ParameterKey:"VpcId",ParameterValue:$vpc},
            {ParameterKey:"InstanceType",ParameterValue:$it},{ParameterKey:"AllowedCidr",ParameterValue:$cidr},
            {ParameterKey:"Password",ParameterValue:$pw},{ParameterKey:"SetupUrl",ParameterValue:$s},
            {ParameterKey:"AppImageUrl",ParameterValue:$a},{ParameterKey:"DebUrl",ParameterValue:$d},
            {ParameterKey:"FlatpakUrl",ParameterValue:$f}]' > params.json

          stack="stremio-test-$GITHUB_RUN_NUMBER"
          aws cloudformation create-stack --stack-name "$stack" --template-body file://test-box.yaml --parameters file://params.json > /dev/null
          if ! aws cloudformation wait stack-create-complete --stack-name "$stack"; then
            aws cloudformation describe-stack-events --stack-name "$stack" \
              --query "StackEvents[?contains(ResourceStatus,'FAILED')].[LogicalResourceId,ResourceStatusReason]" --output text || true
            aws cloudformation delete-stack --stack-name "$stack"
            exit 1
          fi

          url=$(aws cloudformation describe-stacks --stack-name "$stack" --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" --output text)
          {
            echo "## Test box is starting"
            echo
            echo "- Address: $url (the browser warns about the self-signed certificate; continue)"
            echo "- User: \`tester\`"
            echo "- Password: the \`TEST_BOX_PASSWORD\` secret (on your PC: \`~/.stremio-box/password.txt\`)"
            echo "- Ready in about 8 to 12 minutes. Setup progress: \`aws ec2 get-console-output\`"
            echo "- Packages from publish.yml run $RUN_ID. \`REPORT.txt\` on the desktop shows the library checks."
            echo "- It deletes itself after 90 minutes. To delete it now, run this workflow with action=down."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Stack $stack is up at $url"

      - name: Delete every test box
        if: inputs.action == 'down'
        run: |
          set -euo pipefail
          stacks=$(aws cloudformation list-stacks \
            --stack-status-filter CREATE_IN_PROGRESS CREATE_COMPLETE CREATE_FAILED ROLLBACK_COMPLETE ROLLBACK_FAILED DELETE_FAILED \
            --query "StackSummaries[?starts_with(StackName, 'stremio-test-')].StackName" --output text)
          for s in $stacks; do
            echo "Deleting $s"
            aws cloudformation delete-stack --stack-name "$s"
            aws cloudformation wait stack-delete-complete --stack-name "$s"
          done
          aws s3 rm --only-show-errors "s3://$BUCKET/runs/" --recursive
          left=$(aws ec2 describe-instances --filters Name=tag:Project,Values=stremio-test Name=instance-state-name,Values=pending,running,stopping,stopped \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          echo "Stacks deleted: ${stacks:-none}. Instances left: ${left:-none}"
          [ -z "$left" ]
