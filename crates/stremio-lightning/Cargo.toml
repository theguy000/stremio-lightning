[package]
name = "stremio-lightning"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Slint desktop client for Stremio, built on stremio-core"
build = "build.rs"

[dependencies]
stremio-core = { git = "https://github.com/theguy000/stremio-core", branch = "fix/watched-bitfield-flate2", features = ["env-future-send", "derive"] }
http = "1"
regex = "1"
slint = "1.18"
# The wheel is taken from winit rather than from Slint's language, which has no wheel event: this is
# Slint's own winit wrapper, so the hook is the same on Windows, Linux and macOS. `winit` is named
# here only to match the event types that wrapper speaks, at the version it is built against.
i-slint-backend-winit = "1.18"
# `wheel.rs` checks `WindowInner::active_popups()` so open `PopupWindow` dropdowns keep wheel input.
i-slint-core = "1.18"
winit = "0.30"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "net", "time", "macros"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
getrandom = "0.3"
# HTTP/2 for the image hosts: they answer with h2 (measured over ALPN on images.metahub.space), so
# a catalog's posters can multiplex one connection instead of taking six HTTP/1.1 lanes' worth of
# handshakes.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libmpv2 = "5.0.3"
url = "2"
# Release dates on Episode rows, in the shape the web shows them.
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"
# The executable's own icon, from `stremio-lightning.rc`. Only the icon is embedded: the manifest
# is left to the linker, so the process keeps the DPI awareness winit sets up.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.9"

[dev-dependencies]
# UI integration tests instantiate a real Slint `Window` without a display on CI.
i-slint-backend-testing = "1.18"

