[package]
name = "stremio-lightning-native-env"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "stremio-core Env for native (non-web) desktop shells"

[dependencies]
stremio-core = { git = "https://github.com/theguy000/stremio-core", branch = "fix/watched-bitfield-flate2", features = ["env-future-send", "derive"] }
chrono = "0.4"
futures = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "fs"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
