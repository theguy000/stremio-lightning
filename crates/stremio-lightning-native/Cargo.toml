[package]
name = "stremio-lightning-native"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Native Slint desktop client for Stremio, built on stremio-core"
build = "build.rs"

[dependencies]
stremio-lightning-native-env = { path = "../stremio-lightning-native-env" }
stremio-lightning-core = { path = "../stremio-lightning-core" }
stremio-core = { git = "https://github.com/theguy000/stremio-core", branch = "fix/watched-bitfield-flate2", features = ["env-future-send", "derive"] }
slint = "1.18"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "net", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libmpv2 = "5.0.3"
url = "2"

[build-dependencies]
slint-build = "1.18"
